<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Lock the viewport so kiosk / managed-store devices (e.g. Honeywell
      ScanPal EDA52 at Tedi) can't accidentally pinch-zoom or double-tap-
      zoom into a half-magnified UI. `maximum-scale=1` + `user-scalable=no`
      is the belt-and-braces combo — iOS sometimes ignores user-scalable
      for accessibility, but maximum-scale still holds. viewport-fit=cover
      lets us paint behind notches / cut-outs on modern devices.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>WC2026 Predictor</title>
    <meta name="description" content="Predict World Cup 2026 match scores and compete with friends" />

    <meta property="og:title" content="WC2026 Predictor" />
    <meta property="og:description" content="Predict World Cup 2026 match scores and compete with friends" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
