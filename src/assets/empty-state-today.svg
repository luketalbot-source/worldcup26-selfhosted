<svg
  viewBox="0 0 600 450"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-label="An empty stadium at golden hour, awaiting tomorrow's matches"
>
  <defs>
    <!-- Sky: deep indigo at the top → violet → coral → soft amber at horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#6d28d9" />
      <stop offset="65%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Pitch: rich green with a subtle vertical gradient for depth -->
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Soft halo behind the ball -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>

    <!-- Mowing-stripe alternation on the pitch -->
    <pattern id="stripes" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#16a34a" />
      <rect x="0" y="0" width="40" height="20" fill="#15803d" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background sky -->
  <rect width="600" height="450" fill="url(#sky)" rx="24" />

  <!-- Far-distance stars / highlights in the night sky -->
  <g fill="#fff">
    <circle cx="80" cy="50" r="1.2" opacity="0.85" />
    <circle cx="180" cy="30" r="1.5" opacity="0.65" />
    <circle cx="280" cy="70" r="1" opacity="0.75" />
    <circle cx="380" cy="40" r="1" opacity="0.85" />
    <circle cx="480" cy="80" r="1.5" opacity="0.55" />
    <circle cx="540" cy="35" r="1.2" opacity="0.75" />
  </g>

  <!-- Stadium silhouette: a soft curved lip across the horizon -->
  <path
    d="M 0 235 Q 50 178 300 170 Q 550 178 600 235 L 600 250 L 0 250 Z"
    fill="#0f172a"
    opacity="0.88"
  />

  <!-- Floodlight glows along the stadium roof -->
  <g>
    <circle cx="80" cy="172" r="3.5" fill="#fef08a" />
    <circle cx="80" cy="172" r="24" fill="#fef08a" opacity="0.2" />
    <circle cx="200" cy="173" r="2.2" fill="#fef08a" opacity="0.75" />
    <circle cx="400" cy="173" r="2.2" fill="#fef08a" opacity="0.75" />
    <circle cx="520" cy="172" r="3.5" fill="#fef08a" />
    <circle cx="520" cy="172" r="24" fill="#fef08a" opacity="0.2" />
  </g>

  <!-- Pitch in the foreground, drawn as a perspective ellipse -->
  <ellipse cx="300" cy="380" rx="320" ry="84" fill="url(#pitch)" />

  <!-- Mowing stripes on the pitch (clipped to the ellipse via mask) -->
  <mask id="pitchMask">
    <ellipse cx="300" cy="380" rx="320" ry="84" fill="#fff" />
  </mask>
  <g mask="url(#pitchMask)" opacity="0.18">
    <rect x="0" y="296" width="600" height="20" fill="#0f172a" />
    <rect x="0" y="336" width="600" height="20" fill="#0f172a" />
    <rect x="0" y="376" width="600" height="20" fill="#0f172a" />
    <rect x="0" y="416" width="600" height="20" fill="#0f172a" />
  </g>

  <!-- Pitch markings: centre line + centre circle (in perspective) -->
  <g stroke="#fff" stroke-width="2" fill="none" opacity="0.55">
    <line x1="300" y1="298" x2="300" y2="462" />
    <ellipse cx="300" cy="380" rx="68" ry="19" />
  </g>
  <circle cx="300" cy="380" r="2.5" fill="#fff" opacity="0.8" />

  <!-- Soft warm halo behind the ball -->
  <circle cx="300" cy="346" r="60" fill="url(#halo)" />

  <!-- Cast shadow under the ball on the pitch -->
  <ellipse cx="300" cy="378" rx="24" ry="5" fill="#000" opacity="0.4" />

  <!-- Football: stylised classic black-and-white panel pattern -->
  <g transform="translate(300, 348)">
    <!-- White ball -->
    <circle r="26" fill="#fafafa" stroke="#0f172a" stroke-width="1.5" />

    <!-- Centre dark pentagon (the iconic shape) -->
    <path d="M 0 -14 L 13 -4 L 8 11 L -8 11 L -13 -4 Z" fill="#0f172a" />

    <!-- Surrounding partial panels (just enough to read as a football) -->
    <path d="M -22 -11 L -15 -18 L -10 -10 L -17 -4 Z" fill="#0f172a" opacity="0.95" />
    <path d="M 22 -11 L 15 -18 L 10 -10 L 17 -4 Z" fill="#0f172a" opacity="0.95" />
    <path d="M -11 18 L 0 14 L 11 18 L 6 23 L -6 23 Z" fill="#0f172a" opacity="0.95" />

    <!-- Specular highlight: gives the ball a 3D feel -->
    <ellipse cx="-9" cy="-16" rx="7" ry="3" fill="#fff" opacity="0.55" />
  </g>
</svg>
