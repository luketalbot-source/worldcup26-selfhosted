server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the Hono/Bun API server
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Admin panel — restricted to same-origin only, must not be frameable.
    # Client-side React Router handles /admin/* sub-paths, so any request
    # whose path *begins* with /admin gets the restrictive policy.
    # ------------------------------------------------------------------
    location ^~ /admin {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff"              always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options        "SAMEORIGIN"           always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: https:; \
             font-src 'self' data:; \
             connect-src 'self'; \
             frame-ancestors 'self';"
            always;
    }

    # ------------------------------------------------------------------
    # Everything else (main app, tenant apps at /t/*, auth callbacks):
    # iframe-embeddable from any parent origin. The app is explicitly
    # designed to be hosted in a parent site's iframe.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Intentionally NO X-Frame-Options here — absence allows framing.
        # frame-ancestors * lets any parent site embed us.
        add_header X-Content-Type-Options "nosniff"              always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
             style-src 'self' 'unsafe-inline'; \
             img-src 'self' data: https:; \
             font-src 'self' data:; \
             connect-src 'self'; \
             frame-ancestors *;"
            always;
    }
}
